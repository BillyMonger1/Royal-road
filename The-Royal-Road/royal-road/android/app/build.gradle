plugins {
    id 'com.android.application'
}

android {
    namespace 'app.royalroad'
    compileSdk 35

    defaultConfig {
        applicationId 'app.royalroad'
        minSdk 27
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // One fixed signing key, so each new build installs over the last one and keeps your dreams.
    signingConfigs {
        release {
            storeFile file('royal.keystore')
            storePassword 'royalroad'
            keyAlias 'royal'
            keyPassword 'royalroad'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The phone app itself (../../mobile) is packaged straight from its folder, so there is one copy to edit.
    sourceSets {
        main { assets { srcDirs += ['../../mobile'] } }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
