<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https:">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe7f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1928" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>The Royal Road</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body data-view="home" data-state="idle">

<header class="top">
  <h1>The Royal Road<span class="lamp" id="lamp" data-state="off" role="img" aria-label="Not paired"></span></h1>
  <span class="tag">Dream journal</span>
</header>

<!-- Home: one button -->
<main class="home" id="home">
  <p class="eyebrow" id="eyebrow">Capture the moment</p>
  <button class="rec" id="rec" type="button" aria-label="Start recording">
    <span class="rec-ring"></span>
    <span class="rec-well">
      <canvas class="rec-wave" id="wave" aria-hidden="true"></canvas>
      <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
    </span>
  </button>
  <p class="lead" id="lead">Tap to record</p>
  <p class="sub" id="sub">A place to remember your dreams</p>
  <div class="live" id="live" aria-live="polite"></div>
  <button class="textlink" id="typeInstead" type="button">Type it instead</button>
</main>

<!-- Review: read it back, fix it, send it -->
<main class="review" id="review">
  <label class="eyebrow" for="draft">Read it back</label>
  <textarea id="draft" class="well" spellcheck="true" placeholder="Write the dream as you remember it."></textarea>
  <div class="shots" id="shots"></div>
  <p class="sub" id="reviewNote"></p>
  <div class="stack">
    <button class="btn primary" id="send" type="button">Send to desktop</button>
    <button class="btn" id="resume" type="button">Keep recording</button>
    <button class="btn" id="addShot" type="button">Add a picture</button>
    <input id="shotInput" type="file" accept="image/*" multiple hidden>
    <button class="textlink danger" id="discard" type="button">Discard</button>
  </div>
</main>

<!-- Past dreams -->
<main class="past" id="past">
  <button class="textlink back" id="pastBack" type="button">‹ Back</button>
  <h2>Past dreams</h2>
  <p class="sub" id="pastNote"></p>
  <ul class="list" id="pastList"></ul>
  <button class="textlink danger" id="clearSent" type="button">Remove dreams your desktop already has</button>
</main>

<!-- Pairing -->
<main class="pairing" id="pairing">
  <button class="textlink back" id="pairBack" type="button">‹ Back</button>
  <h2>Pair with your desktop</h2>
  <p class="sub left">On the computer, open Setup in The Royal Road and scan the code it shows. Or copy the pairing code there and paste it here.</p>
  <textarea id="pairCode" class="well small" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Paste the pairing code"></textarea>
  <p class="sub left" id="pairNote" role="status"></p>
  <div class="stack">
    <button class="btn primary" id="pairScan" type="button" hidden>Scan code</button>
    <button class="btn" id="pairSave" type="button">Pair</button>
    <button class="textlink danger" id="unpair" type="button">Unpair this phone</button>
  </div>
</main>

<footer class="bottom" id="bottom">
  <button class="rowbtn" id="openPast" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.6 4 5v13c3-.4 6 0 8 1.5 2-1.5 5-1.9 8-1.5V5c-3-.4-6 0-8 1.5zM12 6.5v13"/></svg>
    <span>Past dreams</span><span class="count" id="count"></span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="fine" id="pairStatus" type="button">Not paired with a desktop yet. Tap to pair.</button>
</footer>

<div class="toast" id="toast" role="status"></div>

<script src="android.js"></script>
<script src="relay.js"></script>
<script src="app.js"></script>
</body>
</html>
